# Publish to PyPI when a version tag vX.Y.Z is pushed (e.g. v0.2.0).
# The version in pyproject.toml MUST match the tag (without the "v" prefix).
#
# One-time PyPI setup:
# - Recommended: Trusted Publishing — https://docs.pypi.org/trusted-publishers/
#   (link the PyPI project to this GitHub repo; no long-lived token in secrets).
# - Alternative: secret PYPI_API_TOKEN and use the commented "password" step below.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional: environment: name: pypi + protection rules (Settings → Environments)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches pyproject.toml version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) VER="${TAG#v}" ;;
            *) echo "::error::Tag must start with v (e.g. v0.2.0), got: $TAG"; exit 1 ;;
          esac
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$VER" != "$PKG" ]; then
            echo "::error::Tag $TAG implies version '$VER' but pyproject.toml has '$PKG'"
            exit 1
          fi
          echo "OK: publishing version $PKG"

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      # If you do not use Trusted Publishing: create PYPI_API_TOKEN on PyPI
      # (Account settings → API tokens) and replace the step above with:
      # - uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: dist/
      #     password: ${{ secrets.PYPI_API_TOKEN }}
