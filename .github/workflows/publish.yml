# Publish to PyPI — only when you run this workflow manually (Actions → Publish → Run workflow).
# Bump ``version`` in pyproject.toml and merge to the branch you select before publishing.
#
# One-time PyPI setup:
# - Recommended: Trusted Publishing — https://docs.pypi.org/trusted-publishers/
#   (link the PyPI project to this GitHub repo; no long-lived token in secrets).
# - Alternative: secret PYPI_API_TOKEN and use the commented "password" step below.

name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional: environment: name: pypi + protection rules (Settings → Environments)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Read version from pyproject.toml
        run: |
          set -euo pipefail
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Publishing pap-scraper ${PKG} to PyPI (from pyproject.toml on this ref)"

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      # If you do not use Trusted Publishing: create PYPI_API_TOKEN on PyPI
      # (Account settings → API tokens) and replace the step above with:
      # - uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: dist/
      #     password: ${{ secrets.PYPI_API_TOKEN }}
