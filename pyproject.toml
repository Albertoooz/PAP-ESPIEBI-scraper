[project]
name = "pap-scraper"
version = "0.1.0"
description = "ESPI/EBI report scraper for espiebi.pap.pl"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Albert Zagrajek" }]
keywords = ["pap", "espiebi", "espi", "ebi", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
]

[project.scripts]
pap-scraper = "pap_scraper.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/pap-scraper/"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pap_scraper*"]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "ruff>=0.15.9",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-requests>=2.33.0.20260402",
    "types-urllib3>=1.26.25.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["pap_scraper"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true
